[project]
name = "nmr-graph-matching"
version = "0.1.0"
description = "Deep learning-based graph matching for NMR methyl assignment"
readme = "README.md"
authors = [
    { name = "Felipe Pérez", email = "juan1505@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "biopython>=1.80",
    "nmrglue>=0.9",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.scripts]
nmr-graph-matching = "nmr_graph_matching:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
